<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Portfolio of Jose Castellano, frontend developer focused on building responsive web experiences."
  />
  <title>Jose Castellano | Frontend Developer</title>
  <link rel="stylesheet" href="css/style.css" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Overlock:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <a href="#home" aria-label="Go to home section">
        <h1>Jose Castellano</h1>
      </a>
      <p>Frontend Developer</p>
    </div>

    <ul aria-label="Main navigation">
      <li><a href="#home">Home</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#contact">Contact</a></li>
      <li>
        <button
          id="theme-toggle"
          type="button"
          aria-label="Enable dark mode"
          aria-pressed="false"
        >🌙</button>
      </li>
    </ul>
  </nav>

  <main>
    <section id="home" class="hero">
      <div class="carousel-section">
        <div class="carousel-wrapper">
          <button class="nav-btn prev" id="prev" type="button" aria-label="Previous image">‹</button>

          <div class="carousel" aria-live="polite">
            <div class="card left" aria-hidden="true">
              <img
                src="images/IMG_0104.JPG"
                alt="Secondary portrait"
                width="3840"
                height="2160"
                loading="lazy"
                decoding="async"
              />
            </div>

            <div class="card center">
              <img
                src="images/Me-portrait.png"
                alt="Portrait of Jose Castellano"
                width="2022"
                height="1942"
                decoding="async"
              />
            </div>
            <div class="card right" aria-hidden="true">
              <img
                src="images/IMG_9541.jpg"
                alt="Mac portrait"
                width="3840"
                height="2160"
                loading="lazy"
                decoding="async"
              />
            </div>
          </div>

          <button class="nav-btn next" id="next" type="button" aria-label="Next image">›</button>
        </div>
      </div>

      <div class="about-text">
        <h2>About me</h2>
        <p>Full Stack Software Developer focused on web development.</p>
        <p>Building projects using:</p>
        <ul class="about-list">
          <li>React.js, Node.js, JavaScript, TypeScript</li>
          <li>PostgreSQL and Docker</li>
          <li>Continuous learning mindset</li>
        </ul>
      </div>
    </section>

    <section id="skills" class="skills">
      <h2>Skills</h2>

      <ul class="skills-icons" aria-label="Technical skills">
        <li aria-label="HTML"><i class="devicon-html5-plain" aria-hidden="true"></i></li>
        <li aria-label="CSS"><i class="devicon-css3-plain" aria-hidden="true"></i></li>
        <li aria-label="JavaScript"><i class="devicon-javascript-plain" aria-hidden="true"></i></li>
        <li aria-label="Git"><i class="devicon-git-plain" aria-hidden="true"></i></li>
        <li aria-label="GitHub"><i class="devicon-github-plain" aria-hidden="true"></i></li>
        <li aria-label="SQL"><i class="devicon-mysql-plain" aria-hidden="true"></i></li>
      </ul>
    </section>

    <section id="contact" class="contact">
      <h2>Contact</h2>

      <div class="contact-container">
        <a
          href="mailto:josecastellanosu@icloud.com"
          class="contact-icon"
          title="Email"
          aria-label="Send email"
        >📧</a>

        <a
          href="https://github.com/JoseCastellanoo"
          target="_blank"
          rel="noopener noreferrer"
          class="contact-icon"
          title="GitHub"
          aria-label="Open GitHub profile"
        ><i class="devicon-github-plain" aria-hidden="true"></i></a>

        <a
          href="https://www.linkedin.com/in/jose-castellano-su%C3%A1rez-062390379/"
          target="_blank"
          rel="noopener noreferrer"
          class="contact-icon"
          title="LinkedIn"
          aria-label="Open LinkedIn profile"
        ><i class="devicon-linkedin-plain" aria-hidden="true"></i></a>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
