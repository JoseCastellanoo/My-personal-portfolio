<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="css/style.css" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Bad+Script&family=DM+Serif+Text:ital@0;1&family=Overlock:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <a href="#home">Jose Castellano</a>
      <p>Frontend Developer</p>
    </div>

    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#contact">Contact</a></li>
      <li>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
      </li>
    </ul>
  </nav>

  <main id="home" class="hero">
    <div class="carousel-section">
      <div class="carousel-wrapper">
        <button class="nav-btn prev" id="prev" type="button" aria-label="Previous image">‹</button>

        <div class="carousel">
          <div class="card left">
            <img src="images/6B617E92-634B-479F-B9E8-98FDA062E990.JPG" alt="Secondary portrait" />
          </div>

          <div class="card center">
            <img src="images/Me-portrait.png" alt="Main portrait" />
          </div>
        </div>

        <button class="nav-btn next" id="next" type="button" aria-label="Next image">›</button>
      </div>
    </div>

    <div class="about-text">
      <h2>About me</h2>
      <p>
        Full Stack Software Developer focused on web development.
        Building projects using: <br />
        • React.js, Node.js, JavaScript, TypeScript <br />
        • PostgreSQL and Docker <br />
        • Continuous learning mindset
      </p>
    </div>
  </main>

  <section class="skills">
    <h2>Skills</h2>

    <div class="skills-icons">
      <i class="devicon-html5-plain" title="HTML"></i>
      <i class="devicon-css3-plain" title="CSS"></i>
      <i class="devicon-javascript-plain" title="JavaScript"></i>
      <i class="devicon-git-plain" title="Git"></i>
      <i class="devicon-github-plain" title="GitHub"></i>
      <i class="devicon-mysql-plain" title="SQL"></i>
    </div>
  </section>

  <section id="contact" class="contact">
    <h2>Contact</h2>

    <div class="contact-container">
      <a
        href="mailto:josecastellanosu@icloud.com"
        class="contact-icon"
        title="Email"
        aria-label="Send email"
      >📧</a>

      <a
        href="https://github.com/JoseCastellanoo"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-icon"
        title="GitHub"
        aria-label="Open GitHub profile"
      ><i class="devicon-github-plain"></i></a>

      <a
        href="https://www.linkedin.com/in/jose-castellano-su%C3%A1rez-062390379/"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-icon"
        title="LinkedIn"
        aria-label="Open LinkedIn profile"
      ><i class="devicon-linkedin-plain"></i></a>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
